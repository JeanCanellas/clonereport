services:
  - type: web
    name: clonereport
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DB_PATH
        value: /var/data/clonereport.db
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        value: https://clonereport.com
      - key: SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: turn on email alerts (see README)
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM
        sync: false
      # Optional: email address that receives contact and takedown requests
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
