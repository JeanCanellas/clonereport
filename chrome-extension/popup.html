<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, Arial, sans-serif; background: #1b2838; color: #c7d5e0; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #fff; }
  .status { padding: 8px 10px; border-radius: 4px; background: #2a475e; }
  .clone { background: #8e1b1b; color: #fff; }
  .cloned { background: #7a4100; color: #fff; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  a { color: #66c0f4; }
  .clone a, .cloned a { color: #fff; }
  footer { margin-top: 10px; font-size: 12px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <h1>Clone Report</h1>
  <div id="status" class="status">Open a game page on Steam, PlayStation Store, Xbox, Nintendo eShop, the App Store, Google Play or itch.io to check it.</div>
  <footer>
    <a id="site" href="https://clonereport.com" target="_blank" rel="noopener noreferrer">clonereport.com</a>
    <a id="options" href="#">Settings</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
